name: Food Wellbeing Weekly Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py "Weekly wellbeing automation: search web for latest wellbeing articles, generate 6 Canva report slides, create 5 SNS posts with Canva images, save note article draft to GitHub, send Gmail digest"
