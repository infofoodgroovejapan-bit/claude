name: Food Wellbeing Weekly Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py "週次ウェルビーイング自動化: 最新ウェルビーイング記事をウェブ検索で収集し、Canvaでレポートスライドを6枚生成し、SNS投稿5件(月:学び型/火:4コマ漫画/水:Tips/木:4コマ漫画/金:告知)とCanva画像を作成し、note記事ドラフトをGitHubに保存し、Gmailでダイジェストを配信してください"
